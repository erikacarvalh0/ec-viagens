name: PostgreSQL Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ec_viagens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ec_viagens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ec_viagens_test
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - name: Synchronize disposable test database
        run: npx prisma db push --skip-generate
      - name: PostgreSQL integration tests
        run: npx vitest run src/integration/postgres.test.ts
